[pytest]
testpaths = tests
markers =
    win: needs the Windows desktop (hooks, clipboard, windows)
    gpu: needs the CUDA Whisper model
    real_window_texts: keeps context.window_texts real (the test fakes _read)
    win32_api: calls the win32 API directly (skipped on macOS)
    mac: needs the macOS desktop (keys, clipboard, windows): idle-gated like `win`
